[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-multi-editor"
version = "0.8.0"
description = "Modular Qt Quick editor for Power BI PBIR JSON"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"
